[project]
name = "sih2026"
version = "0.1.0"
description = "Dry bulk charter forecasting pipeline (SIH 2026)"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "polars>=1.0",
    "torch>=2.13.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sih"]

[project.scripts]
build-master = "sih.build_master:main"
baselines = "sih.baselines:main"
build-samples = "sih.build_samples:main"
