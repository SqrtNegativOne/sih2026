[project]
name = "sih2026"
version = "0.1.0"
description = "Dry bulk charter forecasting pipeline (SIH 2026)"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "ortools>=9.15.6755",
    "polars>=1.0",
    "pydantic>=2.13.4",
    "torch>=2.13.0",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml", "src/opt", "src/data_builders"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[project.scripts]
build-master = "data_builders.build_master:main"
baselines = "ml.baselines:main"
build-samples = "data_builders.build_samples:main"
export-models = "ml.export:main"



[tool.ruff.lint]
# Ignore minor stylistic and scratch-stage warnings
ignore = ['SIM118', 'PLR0124', 'RUF059']

