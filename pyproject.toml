[project]
name = "sih2026"
version = "0.1.0"
description = "Dry bulk charter forecasting pipeline (SIH 2026)"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.0",
    # World Bank Commodity Markets Outlook ("Pink Sheet") .xlsx ingestion --
    # P4 macro/commodity signal candidates (crude oil, coal, iron ore).
    "openpyxl>=3.1",
    "ortools>=9.15.6755",
    # PDF ingestion for berth_truth's official daily-traffic-report sources
    # (Paradip, Visakhapatnam -- P1). pypdf was already in use (BT-0's own
    # docstrings reference it) but was never actually declared here; fixed
    # while adding pdfplumber, which does the positional (x/y-coordinate)
    # text extraction the interleaved-column PDFs require -- plain
    # extract_text() reorders columns unpredictably on these documents.
    "pdfplumber>=0.11",
    "polars>=1.0",
    "pydantic>=2.13.4",
    "pypdf>=6.0",
    "requests>=2.32",
    "scikit-learn>=1.5",
    "scipy>=1.14",
    # Shortest sea route over the Eurostat marine network graph. Replaces the
    # hardcoded RouteEnum distance table and its silent 10,000 nm fallback.
    "searoute>=1.2",
    "torch>=2.13.0",
    "xgboost>=3.4.1",
    # backend/ -- the FastAPI wrapper around opt.quote.quote().
    "fastapi>=0.141",
    "uvicorn>=0.52",
    # anchorage.detect.load_scene (4.2) -- real windowed reads of a Sentinel-1
    # GeoTIFF scene (a real lon/lat bbox -> a real pixel window against the
    # scene's own geotransform, reading ONLY that window, never the whole
    # multi-GB scene). Deliberately not added until a real account existed to
    # actually exercise it against -- see that module's own docstring and
    # docs/12_fix_changelog.md's 4.2 entry for why this was proposed and held
    # back rather than added silently.
    "rasterio>=1.5.1",
    # Saves the real CFAR detection overlay PNG (anchorage's own visual
    # sanity check, 4.2's own named "real acceptance test") -- a real scene
    # crop plus real detection markers, drawn once a real scene existed to
    # draw them on. Lighter than a full plotting library for "draw markers
    # on an array and write a PNG."
    "pillow>=12.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml", "src/opt", "src/data_builders", "src/tonnage", "src/impact", "src/berth_truth", "src/fragility", "src/emissions", "src/anchorage", "src/auth", "src/alerts"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
    # tests/backend -- FastAPI's TestClient requires httpx.
    "httpx>=0.28",
    # P7: starlette.testclient.TestClient now prefers httpx2 (Pydantic
    # Services Inc.'s maintained continuation of the original httpx project,
    # BSD-3-Clause) over the legacy httpx transport and emits a
    # StarletteDeprecationWarning otherwise -- confirmed live: installing
    # this alone silences the warning with byte-identical test behaviour
    # (tests/backend/ re-run with -W error::DeprecationWarning). httpx is
    # kept too, not replaced -- other real consumers of it were not audited
    # for a switch, and this fix only needed to be additive.
    "httpx2>=2.12",
]

[project.scripts]
build-master = "data_builders.build_master:main"
baselines = "ml.baselines:main"
build-samples = "data_builders.build_samples:main"
export-models = "ml.export:main"



[tool.ruff.lint]
# Ignore minor stylistic and scratch-stage warnings
ignore = ['SIM118', 'PLR0124', 'RUF059']

[tool.ruff.lint.per-file-ignores]
# The flake8-datetimez (DTZ) family exists to stop *production* code from
# constructing an instant whose timezone it never established -- the real
# failure it prevents is a parsed port timestamp silently shifting by hours
# (see berth_truth/parsers/adani_schedule.parse_timestamp for the concrete
# case). Inside the suite, a naive datetime is the point: fixtures are fixed
# literals chosen to make an assertion readable, they are never compared
# against a real clock, and forcing tz=UTC on each one would add noise to
# every test without making a single one stricter. Scoped to tests/ only, so
# the rule keeps its teeth everywhere it can actually catch a real shift.
"tests/**/*.py" = ["DTZ001", "DTZ005", "DTZ007", "DTZ011"]

[tool.pytest.ini_options]
# Lets tests import `ml`, `opt`, `data_builders` without an editable install.
# "." is for tests/backend, which imports the top-level `backend` package --
# already on sys.path when run as `python -m pytest` (the documented way to
# run this suite), but added explicitly so a bare `pytest` invocation works too.
pythonpath = ["src", "."]
testpaths = ["tests"]
