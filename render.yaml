# Render Blueprint for the FastAPI backend. Import at
# https://dashboard.render.com/select-repo?type=blueprint -- Render reads
# this file automatically once the repo is connected.
#
# Deliberately NOT using a native "uv" runtime (Render has none): the build
# command installs uv itself, then uses it exactly the way CLAUDE.md's own
# `Commands` section runs the backend locally (`uv run uvicorn ...`), so the
# deployed process resolves the same dependency set as `uv.lock` pins rather
# than a separately-resolved requirements.txt.
#
# What this does NOT do: fetch any external data at request time. Per
# CLAUDE.md's "Network policy for new data sources", every real data source
# is a build-time harvester that already wrote into raw_data/ and
# src/data/ -- both are committed to the repo, so the deployed instance reads
# the same on-disk parquet/csv/model files this repo ships, with no live
# network calls of its own beyond what backend/main.py's few unauthenticated
# read routes already document.
services:
  - type: web
    name: sih2026-backend
    runtime: python
    # Free tier: 512MB RAM and spins down after 15 min idle (cold starts take
    # ~30-60s on the next request). Confirmed in production (2026-09-07):
    # Render's own "exceeded its memory limit" alert fired and auto-restarted
    # the instance. NOT torch -- checked, and it's only ever imported by
    # src/ml/model_lstm.py, an offline training script nothing in
    # backend/main.py's import chain reaches. The real pressure is xgboost's
    # three loaded models plus polars holding the on-disk parquet/csv (market
    # history, ~130 ports of satellite port-call data, berth records) in
    # memory across everything backend/main.py imports at startup. Fix:
    # `starter` plan or above in the Render dashboard (Settings -> Instance
    # Type) -- that's a billing change only the account owner can make, so
    # it isn't set here by default.
    plan: free
    buildCommand: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      export PATH="$HOME/.local/bin:$PATH"
      uv sync --frozen
    startCommand: |
      export PATH="$HOME/.local/bin:$PATH"
      uv run uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    # / has no route (see backend/main.py) and 404s; /docs is FastAPI's
    # built-in Swagger UI and always 200s once the app has finished loading
    # models -- a real signal that startup succeeded, not just that the
    # process is running.
    healthCheckPath: /docs
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
